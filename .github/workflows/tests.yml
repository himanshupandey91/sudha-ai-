name: Sudha AI Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check CMake
        run: cmake --version

      - name: Install pytest
        run: pip install pytest

      - name: Run Python tests
        run: python -m pytest
        env:
          PYTHONPATH: .

      - name: Build whisper.cpp
        run: bash scripts/build_whisper.sh
