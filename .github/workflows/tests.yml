name: Sudha AI Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check CMake
        run: cmake --version

      - name: Install pytest
        run: pip install pytest

      - name: Build whisper.cpp
        run: bash scripts/build_whisper.sh

      - name: Download Whisper tiny.en model
        working-directory: whisper.cpp
        run: bash ./models/download-ggml-model.sh tiny.en

      - name: Verify Whisper executable
        working-directory: whisper.cpp
        run: |
          test -x ./build/bin/whisper-cli
          echo "Whisper CLI is ready."

      - name: Verify Whisper model
        working-directory: whisper.cpp
        run: |
          test -f ./models/ggml-tiny.en.bin
          echo "Whisper tiny.en model is ready."

      - name: Run Python tests
        run: python -m pytest
        env:
          PYTHONPATH: .

      - name: Run real Whisper transcription
        working-directory: whisper.cpp
        run: |
          ./build/bin/whisper-cli \
            -m models/ggml-tiny.en.bin \
            -f samples/jfk.wav \
            -nt
